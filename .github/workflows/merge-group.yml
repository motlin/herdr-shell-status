# Checks required for pull requests and merge groups.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Run pre-commit hooks to verify basic hygiene; mise provides the
  # system-language hook tools (pre-commit, vp, markdownlint-cli2)
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: pre-commit run --all-files

  shell-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: just test

  # Lint markdown files
  reviewdog-markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-markdownlint@b85a623ec721cb42896c485633f527cbd2d58063 # v0.31.5
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Lint YAML files
  reviewdog-yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-yamllint@3224b47de22a2fd9c8c0fbc120e6d0049d1f5060 # v1.25.2
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Lint GitHub Actions workflow files
  reviewdog-actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-actionlint@3cbf14efd750961dba35fccbf00f9e14028cb1f5 # v1.80.2
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Security-lint GitHub Actions workflow files
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Audit only this repo's CI config; derived repos may vendor third-party workflows.
          inputs: .github/
          # SARIF upload requires GitHub Advanced Security, which derived private repos may lack.
          advanced-security: false

  # Gate job that requires all checks to pass
  all-checks:
    name: All checks
    if: always()
    needs: [pre-commit, shell-test, reviewdog-markdownlint, reviewdog-yamllint, reviewdog-actionlint, zizmor]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

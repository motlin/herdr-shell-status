# Checks required for pull requests and merge groups.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Run pre-commit hooks to verify basic hygiene; mise provides the
  # system-language hook tools (pre-commit, vp, markdownlint-cli2)
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: pre-commit run --all-files

  shell-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: just test

  # Lint markdown files
  reviewdog-markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-markdownlint@f8e8c509d6e706db79bb39c1c506c968f1a66b82 # v0.32.0
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Lint YAML files
  reviewdog-yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-yamllint@8f84f0fb670d777d3e584ef50faf60eb61605b2a # v1.25.3
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Lint GitHub Actions workflow files
  reviewdog-actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-actionlint@cfa6a621f27735ccc88d35af9d0608692fd9b9f7 # v1.80.8
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Security-lint GitHub Actions workflow files
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Audit only this repo's CI config; derived repos may vendor third-party workflows.
          inputs: .github/
          # SARIF upload requires GitHub Advanced Security, which derived private repos may lack.
          advanced-security: false

  # Gate job that requires all checks to pass
  all-checks:
    name: All checks
    if: always()
    needs: [pre-commit, shell-test, reviewdog-markdownlint, reviewdog-yamllint, reviewdog-actionlint, zizmor]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
